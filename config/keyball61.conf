CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n

# ウォッチドッグを無効化（WDT_DISABLE_AT_BOOTは警告になるため書かない）
CONFIG_WATCHDOG=n

# トラックボール（マウス移動・スクロール）を有効化
CONFIG_ZMK_POINTING=y

# まずは安定起動を確認するためオフにする（NFCT_PINS_AS_GPIOSはoverlayの&uicr側で設定済みなので書かない）
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_DISPLAY=n
