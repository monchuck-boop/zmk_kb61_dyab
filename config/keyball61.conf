# 右手単体で動かすため、分割キーボード通信（スプリット）を無効にする
# 非分割設定（n）にすることで、自動的にPC/スマホと直接Bluetooth・USB通信する単体キーボードになります
CONFIG_ZMK_SPLIT=n

# BluetoothとUSBのコア機能を有効化
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y

# システムライブラリ(picolibc)で拡張文字列処理関数(snprintfなど)を正常に有効化する
CONFIG_PICOLIBC_IO_LONG_LONG=y

# ZMK Studio 設定
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ZMK_BLE_THREAD_STACK_SIZE=2048

# USB・シリアル通信設定
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y

# Bluetooth 送信電波の出力を最大（+8dBm）に引き上げる（nRF52840標準は0dBm）
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 接続パラメータの安定化（Windows 11 等での瞬断防止）
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
