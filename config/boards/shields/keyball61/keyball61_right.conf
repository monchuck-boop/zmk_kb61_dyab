# Central (right) half: Standalone Right-hand configuration (No Studio RPC / No Watchdog)

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

# ---------------------------------------------------------------------------
# PMW3610 trackball (cormoran / DYA driver)
# ---------------------------------------------------------------------------
CONFIG_PMW3610=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=8
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=200
CONFIG_PMW3610_INVERT_X=n
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_ZMK_PMW3610_STUDIO_RPC=n
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=n

# ---------------------------------------------------------------------------
# ZMK Studio / DYA Studio (一旦すべてオフにして安定動作させる)
# ---------------------------------------------------------------------------
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=n

# ---------------------------------------------------------------------------
# Battery & Sleep (単体動作向け)
# ---------------------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ---------------------------------------------------------------------------
# Stacks and buffers
# ---------------------------------------------------------------------------
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# ---------------------------------------------------------------------------
# Standalone (右手単体・非分割モード)
# ---------------------------------------------------------------------------
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
